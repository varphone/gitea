# Replication stores its cross-process write fence in /run/gitea-replication so
# SSH writers can coordinate with snapshot creation. The directory is harmless
# when replication is disabled.
#
# Install this drop-in on the primary only. If gitea.service already sets
# RuntimeDirectory (for example for socket activation), merge the values in one
# assignment: RuntimeDirectory=gitea gitea-replication
[Service]
RuntimeDirectory=gitea-replication
RuntimeDirectoryMode=0750
RuntimeDirectoryPreserve=yes
