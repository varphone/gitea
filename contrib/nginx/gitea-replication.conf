# Route ordinary traffic to Gitea and keep the DR control plane reachable
# while gitea.service is stopped. Replace BACKUP_SERVER_IP.
upstream gitea {
    server 127.0.0.1:3000;
}
upstream gitea_replication {
    server 127.0.0.1:3001;
}
location /_replication/ {
    allow BACKUP_SERVER_IP;
    deny all;
    proxy_pass http://gitea_replication/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}
location / {
    proxy_pass http://gitea;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /maintenance.html;
}
location = /maintenance.html {
    internal;
    root /usr/share/nginx/html;
}
